- id: qg-ref-10
  input: 出1道关于化学平衡的选择题，困难难度
  output: '对于反应N₂(g)+3H₂(g)⇌2NH₃(g)，在某温度下达到平衡时，[N₂]=2mol/L，[H₂]=3mol/L，[NH₃]=4mol/L，则该温度下的平衡常数K为

    答案：B

    解析：K=[NH₃]²/([N₂][H₂]³)=4²/(2×3³)=16/(2×27)=16/54≈0.30。'
