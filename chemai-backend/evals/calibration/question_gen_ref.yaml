    解析：增加反应物O₂浓度，平衡向正反应方向移动。ΔH<0是放热反应，升温平衡逆向移动。减小压强平衡向气体分子数增大的方向(逆向)移动。催化剂不影响平衡。'
  human_score: 90
  note: 题库真题+官方答案+解析
