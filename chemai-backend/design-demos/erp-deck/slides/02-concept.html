<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>02 · 数智化概念</title><link rel="stylesheet" href="../shared/tokens.css"><style>body{display:flex;align-items:flex-start;padding:56px 90px 56px 90px}.container{width:100%;max-width:1740px;transform:translate(-40px,0) scale(1.04)}h2{font-family:var(--font-display);font-size:48px;font-weight:900;margin:0 0 8px 0;line-height:1.2}h2 .highlight{color:var(--wb-green)}.subhead{font-size:26px;color:var(--text-secondary);margin:0 0 32px 0;line-height:1.5}.card-row{display:flex;gap:28px;margin-bottom:24px}.card{flex:1;background:var(--navy-card);border-radius:14px;padding:28px 30px}.card .tag{display:inline-block;padding:4px 14px;border-radius:3px;font-size:20px;font-weight:700;letter-spacing:.06em;margin-bottom:14px}.card .tag.d{background:rgba(0,82,217,.15);color:var(--tencent-blue)}.card .tag.i{background:rgba(7,193,96,.15);color:var(--wb-green)}.card h4{font-size:26px;font-weight:700;color:var(--text-primary);margin:0 0 10px 0}.card p{font-size:23px;color:var(--text-secondary);line-height:1.6}.card .example{font-size:21px;color:var(--text-muted);line-height:1.6;margin-top:10px;padding-top:10px;border-top:1px solid var(--navy-lighter)}.arrow{display:flex;align-items:flex-start;justify-content:center;padding:0}.arrow span{font-size:40px;color:var(--wb-green)}</style></head><body><div class="accent-bar"></div><div class="container"><p class="section-label">数智化概念厘清</p><h2><span class="highlight">数智化</span> = 数字化 + 智能化</h2><p class="subhead">两层之间有严格的先后顺序：没有数字化打底，智能化就是空中楼阁。</p><div class="card-row"><div class="card"><div class="tag d">数字化</div><h4>把物理世界翻译成数据</h4><p>纸质单据 → 结构化数据<br>线下流程 → 系统线上流转<br>人工记录 → 自动采集</p><div class="example">例：工人 PDA 点"领料" → 系统自动扣库存、生成领料记录。ERP 本质上就干这个。</div></div><div class="card"><div class="tag i">智能化</div><h4>让数据产生决策价值</h4><p>不只是记录，还能预测<br>不只是展示，还能建议<br>不只是执行，还能优化</p><div class="example">例：系统不只告诉你"库存剩 500"，而是告诉你"下周三会缺料，建议今天下单采购 2000，供应商 A 最优"。</div></div></div></div><div class="page-num">02</div></body></html>
