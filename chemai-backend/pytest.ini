[pytest]
# 2026-09-12 /health 发现：裸 pytest 会把 _temp/（依赖活服务器的手工脚本）、
# _e2e_accept/（第三方源码拷贝）等目录扫进收集，9 个收集错误直接中断、0 测试执行，
# 而正式套件 tests/ 实际 403 全绿。此处锁定收集范围，双保险：
#   1) testpaths 限定默认收集目录（裸 pytest 只跑正式套件）；
#   2) norecursedirs 保证即使显式 `pytest .` 也不会误收垃圾目录。
testpaths = tests
norecursedirs = .* _darcs build dist CVS *.egg venv node_modules frontend legacy _temp _e2e_accept _archive chem_skills
